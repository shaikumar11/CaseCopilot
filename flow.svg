<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="260" viewBox="0 0 1400 260" role="img" aria-labelledby="title desc">
  <title id="title">CaseCopilot case workflow</title>
  <desc id="desc">A support case moves from intake through triage, PII masking, knowledge retrieval, response drafting and guardrail evaluation, then either human review or approval.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f2742" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1400" height="260" rx="18" fill="#f7fafc"/>
  <text x="48" y="43" fill="#102a43" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750">From incoming request to reviewed response</text>
  <path d="M130 132H1270" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(45 78)">
      <rect width="150" height="108" rx="14" fill="#eaf3ff" stroke="#c7ddf8"/>
      <circle cx="75" cy="27" r="15" fill="#2563eb"/>
      <text x="75" y="32" fill="#fff" font-size="13" font-weight="700">1</text>
      <text x="75" y="65" fill="#173b60" font-size="14" font-weight="700">Case intake</text>
      <text x="75" y="84" fill="#58718c" font-size="10">Receive request</text>
    </g>
    <g transform="translate(245 78)">
      <rect width="150" height="108" rx="14" fill="#eaf3ff" stroke="#c7ddf8"/>
      <circle cx="75" cy="27" r="15" fill="#2563eb"/>
      <text x="75" y="32" fill="#fff" font-size="13" font-weight="700">2</text>
      <text x="75" y="65" fill="#173b60" font-size="14" font-weight="700">AI triage</text>
      <text x="75" y="84" fill="#58718c" font-size="10">Classify priority</text>
    </g>
    <g transform="translate(445 78)">
      <rect width="150" height="108" rx="14" fill="#e9f8f4" stroke="#b9e8dc"/>
      <circle cx="75" cy="27" r="15" fill="#0f9b78"/>
      <text x="75" y="32" fill="#fff" font-size="13" font-weight="700">3</text>
      <text x="75" y="65" fill="#145b4d" font-size="14" font-weight="700">PII masking</text>
      <text x="75" y="84" fill="#4f7c72" font-size="10">Mask personal data</text>
    </g>
    <g transform="translate(645 78)">
      <rect width="150" height="108" rx="14" fill="#e9f8f4" stroke="#b9e8dc"/>
      <circle cx="75" cy="27" r="15" fill="#0f9b78"/>
      <text x="75" y="32" fill="#fff" font-size="13" font-weight="700">4</text>
      <text x="75" y="65" fill="#145b4d" font-size="14" font-weight="700">Knowledge</text>
      <text x="75" y="84" fill="#4f7c72" font-size="10">Retrieve relevant info</text>
    </g>
    <g transform="translate(845 78)">
      <rect width="150" height="108" rx="14" fill="#eaf3ff" stroke="#c7ddf8"/>
      <circle cx="75" cy="27" r="15" fill="#2563eb"/>
      <text x="75" y="32" fill="#fff" font-size="13" font-weight="700">5</text>
      <text x="75" y="65" fill="#173b60" font-size="14" font-weight="700">Draft reply</text>
      <text x="75" y="84" fill="#58718c" font-size="10">Prepare suggestion</text>
    </g>
    <g transform="translate(1045 78)">
      <rect width="150" height="108" rx="14" fill="#fff5e5" stroke="#f3d7a5"/>
      <circle cx="75" cy="27" r="15" fill="#d18a18"/>
      <text x="75" y="32" fill="#fff" font-size="13" font-weight="700">6</text>
      <text x="75" y="65" fill="#805313" font-size="14" font-weight="700">Guardrails</text>
      <text x="75" y="84" fill="#967447" font-size="10">Check risk/confidence</text>
    </g>
    <g transform="translate(1245 78)">
      <rect width="110" height="108" rx="14" fill="#e9f8f4" stroke="#b9e8dc"/>
      <circle cx="55" cy="27" r="15" fill="#0f9b78"/>
      <text x="55" y="32" fill="#fff" font-size="13" font-weight="700">7</text>
      <text x="55" y="64" fill="#145b4d" font-size="13" font-weight="700">Review</text>
      <text x="55" y="82" fill="#4f7c72" font-size="9">Approve / send</text>
    </g>
  </g>
  <text x="1120" y="218" text-anchor="middle" fill="#9a6417" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Sensitive or low-confidence cases → human review</text>
</svg>
